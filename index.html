<!DOCTYPE html>
<html lang="ja" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="就職活動の選考状況・提出物・締切・重要事項をひとまとめに管理できるアプリ">
<meta name="theme-color" content="#1c6fe0">
<title>就活ダッシュボード</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<svg class="sprite" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.5 20v-6h5v6"/></symbol>
  <symbol id="i-building" viewBox="0 0 24 24"><path d="M4 21V5.5A1.5 1.5 0 0 1 5.5 4h7A1.5 1.5 0 0 1 14 5.5V21"/><path d="M14 10h4.5A1.5 1.5 0 0 1 20 11.5V21"/><path d="M2.5 21h19"/><path d="M7 8h4M7 12h4M7 16h4M17 14h1M17 17.5h1"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M9 11.5 11.5 14l5-5.5"/><rect x="3.5" y="3.5" width="17" height="17" rx="4"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></symbol>
  <symbol id="i-stack" viewBox="0 0 24 24"><path d="m12 3 8.5 4.5L12 12 3.5 7.5 12 3Z"/><path d="m3.5 12 8.5 4.5L20.5 12"/><path d="m3.5 16.5 8.5 4.5 8.5-4.5"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l1.8-1.4-1.9-3.3-2.2.8a7.6 7.6 0 0 0-2.6-1.5L14.2 2h-3.8l-.3 2.3a7.6 7.6 0 0 0-2.6 1.5l-2.2-.8L3.4 8.3l1.8 1.4a7.6 7.6 0 0 0 0 3l-1.8 1.4 1.9 3.3 2.2-.8a7.6 7.6 0 0 0 2.6 1.5l.3 2.3h3.8l.3-2.3a7.6 7.6 0 0 0 2.6-1.5l2.2.8 1.9-3.3-1.8-1.4Z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5 21 19.5H3L12 3.5Z"/><path d="M12 9.5v4.5M12 17h.01"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3Z"/><path d="m14.5 6.5 3 3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 6.5h15M9.5 6.5V4h5v2.5M6.5 6.5 7.5 20h9l1-13.5M10.5 10v6.5M13.5 10v6.5"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11.5" height="11.5" rx="2.5"/><path d="M15 6.5V6a2.5 2.5 0 0 0-2.5-2.5h-6A2.5 2.5 0 0 0 4 6v6a2.5 2.5 0 0 0 2.5 2.5H7"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 3.5h6l-.8 5 3.3 3.2H6.5L9.8 8.5 9 3.5Z"/><path d="M12 11.7V20"/></symbol>
  <symbol id="i-chevron-l" viewBox="0 0 24 24"><path d="m14.5 5-7 7 7 7"/></symbol>
  <symbol id="i-chevron-r" viewBox="0 0 24 24"><path d="m9.5 5 7 7-7 7"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 19a4.5 4.5 0 0 1-.4-9A6 6 0 0 1 18 10.5a4.25 4.25 0 0 1-.6 8.5H7Z"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10.5 13.5a3.5 3.5 0 0 0 5 0l3-3a3.54 3.54 0 0 0-5-5l-1.6 1.6"/><path d="M13.5 10.5a3.5 3.5 0 0 0-5 0l-3 3a3.54 3.54 0 0 0 5 5l1.6-1.6"/></symbol>
</svg>

<div class="app">
  <header class="topbar">
    <button class="topbar__brand" id="brandBtn" type="button">
      <span class="topbar__logo">就</span>
      <span class="topbar__titles">
        <strong id="topTitle">ダッシュボード</strong>
        <small id="topSub">就活ダッシュボード</small>
      </span>
    </button>
    <div class="topbar__actions">
      <span class="sync-dot" id="syncDot" title="同期状態" hidden></span>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="設定">
        <svg class="icon"><use href="#i-gear"/></svg>
      </button>
    </div>
  </header>

  <nav class="sidenav" id="sidenav" aria-label="メインメニュー"></nav>

  <main class="main" id="main" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" aria-label="メインメニュー"></nav>

  <button class="fab" id="fab" type="button" hidden>
    <svg class="icon"><use href="#i-plus"/></svg>
    <span id="fabLabel">追加</span>
  </button>
</div>


<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
